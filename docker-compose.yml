services:
  postgres:
    image: postgres:16
    container_name: sa_projects_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sa
      POSTGRES_PASSWORD: sa_local_dev
      POSTGRES_DB: sa_projects
    ports:
      - "5432:5432"
    volumes:
      - sa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa -d sa_projects"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sa_pgdata:
